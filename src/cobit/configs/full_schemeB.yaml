# Full DB, split scheme B: test = {conv_softmax, coremark}, train = the rest.
# Update data.db_root to the full database location before running.
data:
  db_root: /scratch/PI/eeweiz/jjiangan/c906_db_net_1cyc_20260729
  cache_dir: output/cobit_cache/full
  target: "Pc(x_aq_core)"
  chunk_rows: 8192
  min_toggle_count: 1

split:
  test_benchmarks: [conv_softmax, coremark]
  val_fraction: 0.2

selection:
  selector: mcp
  gamma: 3.0
  target_qs: [50, 100, 150, 200, 250, 300, 370, 400]
  q_tol: 0.10
  max_bisect: 12
  max_rows: 50000
  grid_points: 30
  grid_decades: 4.0
  max_iter: 200

hpo:
  sampler: nsga3
  pruner: hyperband
  prune_mode: truncate
  n_trials: 256
  population_size: 32
  r_rgs: [20, 30, 40, 50, 60, 70, 80, 90]
  t_th: 800
  hv_ref: [32.0, 3200.0]
  run_pair_comparison: false
  pair_pop_sizes: [16, 32, 48]
  pair_n_trials: 512
  pair_q: 200
  pair_r: 50

eval:
  apet: [0.01, 0.03, 0.05]
  peak_window: 1000
  multicycle_windows: [8, 16, 32, 64, 128]
  trace_plot_cycles: 12000

runtime:
  seed: 0
  allow_tiny: false
  output_dir: output/cobit_runs
