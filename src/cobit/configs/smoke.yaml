# Smoke test on the 2-row sample DB: exercises every pipeline stage end-to-end
# with tiny knobs. Metrics are meaningless (2 cycles/benchmark); this only
# verifies wiring and artifact generation.
data:
  db_root: c906_db_net_1cyc_20260729_2rows
  cache_dir: output/cobit_cache/sample
  target: "Pc(x_aq_core)"
  chunk_rows: 65536
  min_toggle_count: 1

split:
  test_benchmarks: [conv_softmax]   # scheme A
  val_fraction: 0.5

selection:
  selector: mcp
  gamma: 3.0
  target_qs: [8]
  q_tol: 1.0        # accept any Q near the target on degenerate data
  max_bisect: 0
  max_rows: 1000
  grid_points: 8
  grid_decades: 3.0
  max_iter: 50

hpo:
  sampler: nsga3
  pruner: hyperband
  prune_mode: truncate
  n_trials: 8
  population_size: 4
  r_rgs: [3]
  t_th: 64
  hv_ref: [64.0, 256.0]
  run_pair_comparison: true         # exercise Algorithm 2 driver too
  pair_pop_sizes: [4]
  pair_n_trials: 6
  pair_q: null
  pair_r: 3

eval:
  apet: [0.01, 0.03, 0.05]
  peak_window: 2
  multicycle_windows: []            # no room for windows in 2 cycles

runtime:
  seed: 0
  allow_tiny: true
  output_dir: output/cobit_runs
