# binary_fit — cp0 single-bit dataset (test = {conv_softmax, coremark}).
# Ridge (L2-penalized linear) fit variant. Paths are relative to the repo root.
#
# Pipeline: --build_db reads `build.source_db_root/func/<module>/` and writes the
# single-bit dataset to `build.out_root/func/`; --feature_select and --fit then
# read `data.func_dir` / `data.pwr_dir` (which point at that materialized dataset).
#
# This backend is the linear reference point for `tree` and `nn`: how much of the
# power is a weighted sum of the selected proxy bits, with per-bit watts to show
# for it (`ridge_coefficients.csv`). Note there is no `hpo:` block — alpha comes
# from RidgeCV's leave-one-out generalized CV over the fitting rows, not from an
# optuna study on the validation tail, so its knobs live under `ridge:` below.

build:
  source_db_root: dataset/c906_aq_core_1cyc_20260729   # raw per-cycle signal-state func pkls
  modules: [aq_core]
  out_root: dataset/c906_aq_core_singlebit_1cyc_20260901
  drop_dead_bits: true                                 # drop globally constant-0/constant-1 bits

data:
  func_dir: dataset/c906_aq_core_singlebit_1cyc_20260901/func   # materialized single-bit features
  pwr_dir: dataset/c906_aq_core_singlebit_1cyc_20260901/pwr     # pre-populated (Pc(x_aq_core))
  target: "Pc(x_aq_core)"
  window_size: 4             # cycles averaged into ONE row before selection + fit
                             # (features -> per-window bit densities, label -> mean
                             #  power; 1 = per-cycle. eval knobs count these rows)
  min_toggle_count: 1        # kept-bit lower floor, counted on the per-cycle bits

split:
  test_benchmarks: [conv_softmax, coremark]
  val_fraction: 0.2          # ridge is the one backend that also runs at 0.0:
                             # its alpha search never touches the val split

selection:                   # Stage 1: proxy selection (must match cobit.yaml)
  selector: mcp              # LR-MCP, the prior art this baseline reproduces;
                             # `selection.selector=fsr` for greedy forward
                             # selection (exact Q, better held-out transfer)
  gamma: 3.0                 # LOWER gamma reaches MORE proxies at a converged tol
                             # (gamma->inf IS Lasso); "raise gamma" was backwards
  tol: 1.0e-6                # NOT skglm's default 1e-4 -- that absolute tolerance
                             # exceeds this problem's whole gradient scale
                             # (alpha_max=1.8e-3) and pinned Q at 17
  target_qs: [50]
    # feature_select records the max-q set for --fit -q to slice
  dedup_proxies: true
  exact_q: true
  resolve_cold: true         # warm-started sweep, cold re-solve of the reported alpha
  kkt_report: true
  q_tol: 0.10
  max_bisect: 12
  max_rows: 50000
  grid_points: 30
  grid_decades: 4.0
  max_iter: 200              # dead configuration until tol is set

ridge:                       # Stage-2 ridge: the RidgeCV alpha grid and row cap
  alpha_rel_max: 100.0       # top of the descending log grid, PER FITTING ROW.
                             # sklearn minimizes a SUM and train-standardizing
                             # makes diag(Z'Z)=n exactly, so a unit-variance
                             # direction is shrunk by 1/(1+alpha_rel): 1e2 ->
                             # 0.0099, 1e-6 -> 0.999999. One relative number means
                             # the same regularization at every n; a fixed
                             # ABSOLUTE grid does not (a 1e4 ceiling shrinks to
                             # 0.013 at n=135 but only 0.95 at n=200000).
                             # NB: plain YAML needs a SIGNED exponent (1.0e+2) --
                             # an unsigned 1.0e2 parses as a string, which
                             # validate() rejects with a message saying so
  grid_decades: 8.0          # grid spans alpha_rel_max * 10**-decades -> 1e-6.
                             # The floor stays off 0 on purpose: 80.3% of the
                             # aq_core kept bits are exact copies of another bit,
                             # so X'X is rank-deficient and an unregularized solve
                             # blows up (max|coef| 6.8e4 at alpha=0 vs 1.5 at 1e-8)
  grid_points: 25
  max_rows: 200000           # seeded row cap for the fit (0 -> all rows). Two costs
                             # scale with rows: the float64 standardized design is
                             # n_rows x Q x 8 bytes (160 MB here, 16 GB at the
                             # window_size=1 x Q=1000 corner), and RidgeCV's "cov"
                             # GCV path redoes an n x Q matmul once PER alpha.
                             # Never fires at window_size: 32 (aq_core: 8616 rows)
  fit_intercept: true

train:
  nthread: 0                 # 0 -> all cores (unused by ridge; kept for parity)
  base_seed: 0

eval:                        # NB: every window/row knob below counts ROWS, and one
                             # row is data.window_size cycles (see README)
  apet: [0.01, 0.03, 0.05]
  peak_window: 100           # rows per peak-detection window
  peak_sigma: 3.0
  multicycle_windows: [8, 16, 32, 64, 128]
  mape_eps_frac: 0.001

runtime:
  seed: 0
  allow_tiny: false
  output_dir: analysis/binary_fit
  run_name: ""
